[project]
name = "core-backend"
version = "0.1.0"
description = "CORE - Control Optimizado de Rutas y Emergencias (FastAPI Backend)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.2",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.3.3",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Las deprecaciones de Starlette/FastAPI rompen la suite en lugar de pasar desapercibidas.
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes/guiones

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["RUF012"]  # __table_args__ de SQLAlchemy
"app/ml/train_models.py" = ["E402"]
