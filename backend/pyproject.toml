[project]
name = "core-backend"
version = "0.1.0"
description = "CORE - Control Optimizado de Rutas y Emergencias (FastAPI Backend)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.2",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests", "tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
